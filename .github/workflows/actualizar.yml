name: Actualizar datos
on:
  schedule:
    # Lunes a viernes, cada 2 horas desde las 07:00 hasta las 21:00 UTC
    - cron: "0 7-21/2 * * 1-5"
    # Lunes a viernes, una pasada final tras el cierre de Wall Street
    - cron: "30 22 * * 1-5"
    # Fines de semana, una vez al día (para el bitcoin)
    - cron: "0 23 * * 0,6"
  workflow_dispatch:
  push:
    paths:
      - "empresas.json"
concurrency:
  group: actualizar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_datos.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Actualización diaria" && git pull --rebase origin main && git push)
