<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Índices">
<title>Índices financieros</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f5f8;--card:#ffffff;--text:#0f172a;--muted:#6b7280;--up:#16a34a;--down:#dc2626;--accent:#2563eb;--line:#e5e7eb;--sombra:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06)}
@media (prefers-color-scheme: dark){:root{--bg:#0b1120;--card:#161f33;--text:#f1f5f9;--muted:#94a3b8;--up:#4ade80;--down:#f87171;--accent:#60a5fa;--line:#26324a;--sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:8px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:4px 2px;transition:color .2s}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{transform:translateY(-2px) scale(1.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1.5px solid transparent;border-radius:18px;padding:12px 12px 8px;cursor:pointer;text-align:left;color:inherit;font:inherit;box-shadow:var(--sombra);animation:aparece .4s ease both;transition:transform .15s,border-color .2s}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--accent)}
.card .n{font-size:12px;color:var(--muted);font-weight:500}
.card .v{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
.card .c{display:inline-block;font-size:12px;font-weight:700;margin-top:5px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent)}
.card svg.spark{display:block;width:100%;height:34px;margin-top:6px}
.card .d{font-size:11px;color:var(--muted);margin-top:2px}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.up{color:var(--up)}.down{color:var(--down)}
.bar,.monedas{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:14px;box-shadow:var(--sombra)}
.bar{margin:18px 0 10px}
.monedas{margin-bottom:14px}
.bar button,.monedas button{flex:1;min-width:0;padding:8px 6px;border:0;background:none;color:var(--muted);border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.bar button.on,.monedas button.on{background:var(--accent);color:#fff}
.lectura{background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:10px;font-size:14px;font-weight:600;min-height:42px;line-height:1.4;box-shadow:var(--sombra)}
.chart{background:var(--card);border-radius:18px;padding:12px;height:340px;position:relative;box-shadow:var(--sombra)}
.chart canvas{touch-action:pan-y}
.pista{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
.all{width:100%;margin-top:12px;padding:12px;border:0;background:var(--card);color:var(--accent);border-radius:14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--sombra)}
.all.on{background:var(--accent);color:#fff}
.msg{padding:24px;color:var(--muted);text-align:center;grid-column:1/-1}
.lista{display:block}
.cab,.fila{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1.1fr) repeat(3,minmax(0,.85fr));gap:4px;align-items:center}
.cab{padding:0 12px 6px;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.cab .ord{cursor:pointer}
.cab .act{color:var(--accent)}
.grupo{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 8px}
.cab span:not(:first-child){text-align:right}
.fila{width:100%;background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--sombra);color:inherit;font:inherit;text-align:left;cursor:pointer;animation:aparece .4s ease both;transition:transform .15s,border-color .2s}
.fila:active{transform:scale(.98)}
.fila.sel{border-color:var(--accent)}
.fila .nom b{display:block;font-size:14px}
.fila .nom small{color:var(--muted);font-size:11px}
.fila .num{text-align:right;font-size:12px;font-weight:700}
.fila .num small{display:block;font-size:11px;font-weight:600}
.nota{color:var(--muted);font-size:11px;margin:4px 2px 12px}
#detalle{margin-bottom:12px}
.edbar{display:flex;justify-content:flex-end;margin-bottom:8px}
.edbar button{border:0;background:var(--card);color:var(--accent);padding:8px 14px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;box-shadow:var(--sombra);cursor:pointer}
#editor{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#editor.hide{display:none}
html,body{overscroll-behavior-y:contain}
.monedas button{display:flex;flex-direction:column;align-items:center;gap:1px}
.monedas small{font-size:11px;font-weight:500;opacity:.85}
#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translate(-50%,-70px);opacity:0;z-index:40;background:var(--card);color:var(--text);box-shadow:var(--sombra);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;pointer-events:none;transition:transform .25s,opacity .25s;white-space:nowrap}
.hide{display:none}
.hoja{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.hoja-cab{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:10px}
.hoja-cab button{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.hoja input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:14px;margin-bottom:8px}
.btn{width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card);color:var(--accent);box-shadow:var(--sombra)}
.btn:disabled{opacity:.5}
.enlace{display:block;margin:14px auto 0;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.edfila{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.edfila .i{flex:1;min-width:0}
.edfila small{display:block;color:var(--muted);font-size:11px}
.edfila button{border:0;background:none;font-size:18px;cursor:pointer}
.msgEd{font-size:13px;margin:8px 0;color:var(--muted);line-height:1.5}
.hoy{display:block}
.resumen{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sombra);margin-bottom:14px}
.resumen .num2{display:flex;justify-content:space-between;align-items:flex-end}
.resumen .grande{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.resumen small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.barra{height:8px;border-radius:999px;background:var(--down);overflow:hidden;margin-top:14px}
.barra span{display:block;height:100%;background:var(--up);border-radius:999px 0 0 999px}
.mov{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--card);border:0;border-radius:14px;padding:11px 14px;margin-bottom:8px;box-shadow:var(--sombra);color:inherit;font:inherit;text-align:left;cursor:pointer;animation:aparece .4s ease both}
.mov b{display:block;font-size:14px}
.mov small{color:var(--muted);font-size:11px}
.mov .c{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent);white-space:nowrap}
.instalar{background:var(--accent);color:#fff;border-radius:16px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.4}
.instalar button{margin:8px 8px 0 0;border:0;background:#fff;color:var(--accent);font:inherit;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer}
.instalar button.sec{background:none;color:#fff;font-weight:500;text-decoration:underline;padding-left:0}
.aviso{background:color-mix(in srgb,var(--down) 12%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin-bottom:10px}
.hoja input,.hoja select{font-size:16px}
.hoja select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:16px;margin:4px 0 8px}
.res{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:12px;padding:10px 12px;margin-bottom:6px;color:inherit;font:inherit;cursor:pointer}
.res b{display:block;font-size:14px}
.res small{color:var(--muted);font-size:11px}
.res:disabled{opacity:.5}
.edsel{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.edsel .i{flex:1;min-width:0}
.edsel small{display:block;color:var(--muted);font-size:11px}
.edsel button{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.pasos{padding-left:20px;font-size:13px;color:var(--muted);line-height:1.5}
.pasos a{color:var(--accent)}
.hide{display:none}
</style>
</head>
<body>
<div id="ptr"></div>
<h1>Índices financieros</h1>
<div class="sub" id="sub">Cargando…</div>
<div class="tabs" id="tabs"></div>
<div class="monedas hide" id="monedas"></div>
<div class="grid" id="cards"></div>
<div id="detalle">
  <div class="bar" id="rangos"></div>
  <div class="lectura" id="lectura"></div>
  <div class="chart"><canvas id="grafico"></canvas></div>
  <div class="pista">Pasa el cursor o desliza el dedo por el gráfico para ver la fecha y el valor.</div>
  <button class="all" id="todos">Comparar todos los de esta sección</button>
</div>

<div id="editor" class="hide">
  <div class="hoja">
    <div class="hoja-cab"><b>Editar empresas</b><button id="edCerrar" aria-label="Cerrar">✕</button></div>
    <div id="edCuerpo"></div>
  </div>
</div>

<script>
const COLORES = ["#2563eb","#16a34a","#dc2626","#f59e0b","#9333ea","#0891b2","#db2777","#65a30d"];
const RANGOS = {"1M":30,"6M":182,"1A":365,"5A":1825,"Máx":99999};
let secciones = [], simbolos = [], filas = [];
let iSec = 0, seleccion = null, rango = "1A", comparar = false, grafico = null;
let moneda = "USD", filasEUR = [], avisos = {};

const fmt = (n, d = 2) => n.toLocaleString("es-ES", {maximumFractionDigits: d});
const fechaCorta = f => f.slice(8, 10) + "/" + f.slice(5, 7);
const fechaLarga = f => new Date(f + "T00:00:00").toLocaleDateString("es-ES", {day: "numeric", month: "short", year: "numeric"});
const simboloDe = u => u.tasa ? " %" : (u.moneda === "USD" ? " $" : (u.moneda === "EUR" ? " €" : ""));

// Línea vertical que acompaña al cursor o al dedo
const cruz = {
  id: "cruz",
  afterDatasetsDraw(chart) {
    const act = chart.tooltip ? chart.tooltip.getActiveElements() : [];
    if (!act.length) return;
    const x = act[0].element.x, a = chart.chartArea, ctx = chart.ctx;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x, a.top); ctx.lineTo(x, a.bottom);
    ctx.lineWidth = 1; ctx.strokeStyle = chart.options.plugins.cruz.color;
    ctx.stroke(); ctx.restore();
  }
};
const seccion = () => secciones[iSec] || {items: []};
const esLista = () => seccion().nombre === "Empresas";
const enEuros = () => moneda === "EUR" && seccion().convertible;
const baseFilas = () => enEuros() ? filasEUR : filas;

// Convierte a euros los activos marcados como convertibles (dólares / EURUSD)
function prepararEUR() {
  const fxIdx = simbolos.indexOf("EURUSD=X");
  const conv = new Set(secciones.flatMap(s => s.items.filter(i => i.convertible).map(i => i.simbolo)));
  let fx = null;
  filasEUR = filas.map(r => {
    const v = r.v.slice();
    if (fxIdx >= 0 && r.v[fxIdx] !== null) fx = r.v[fxIdx];
    simbolos.forEach((s, i) => {
      if (conv.has(s)) v[i] = (v[i] !== null && fx) ? v[i] / fx : null;
    });
    return {f: r.f, v};
  });
}

// Tarjetas de la sección actual, con valores en euros si procede
function itemsVista() {
  return seccion().items.map(u => {
    if (!(enEuros() && u.convertible)) return u;
    const i = simbolos.indexOf(u.simbolo);
    const pts = [];
    for (let k = filasEUR.length - 1; k >= 0 && pts.length < 2; k--) {
      const x = filasEUR[k].v[i];
      if (x !== null) pts.push({f: filasEUR[k].f, x});
    }
    if (pts.length < 2) return null;
    return Object.assign({}, u, {valor: pts[0].x, fecha: pts[0].f,
      variacion: (pts[0].x / pts[1].x - 1) * 100, moneda: "EUR"});
  }).filter(Boolean);
}

async function cargar(forzar) {
  try {
    const t = Date.now(), op = {cache: forzar ? "reload" : "no-store"};
    const [r1, r2] = await Promise.all([
      fetch("data/ultimo.json?" + t, op),
      fetch("data/historico.csv?" + t, op)
    ]);
    if (!r1.ok || !r2.ok) throw new Error("No se encuentran los datos");
    const previa = secciones[iSec] && secciones[iSec].nombre;
    secciones = (await r1.json()).secciones;
    secciones.unshift({nombre: "Hoy", hoy: true, items: [], tasa: false, convertible: false});
    const lineas = (await r2.text()).trim().split("\n");
    simbolos = lineas[0].split(",").slice(1);
    filas = lineas.slice(1).map(l => {
      const p = l.split(",");
      return {f: p[0], v: p.slice(1).map(x => x === "" ? null : parseFloat(x))};
    });
    const fechas = secciones.flatMap(s => s.items.map(i => i.fecha)).sort();
    document.getElementById("sub").textContent =
      (fechas.length ? "Datos hasta el " + fechas[fechas.length - 1] : "") + (navigator.onLine ? "" : " · sin conexión");
    try {
      const ra = await fetch("data/avisos.json?" + t, op);
      avisos = ra.ok ? ((await ra.json()).sin_datos || {}) : {};
    } catch (e) { avisos = {}; }
    prepararEUR();
    const kPrev = secciones.findIndex(s => s.nombre === previa);
    iSec = kPrev >= 0 ? kPrev : 0;
    elegirPorDefecto();
    refrescar();
    return true;
  } catch (e) {
    if (!secciones.length) {
      document.getElementById("sub").textContent = "";
      document.getElementById("cards").innerHTML = '<div class="msg">No se han podido cargar los datos.</div>';
    }
    return false;
  }
}

function elegirPorDefecto() {
  const items = seccion().items;
  if (esLista()) { if (!items.find(i => i.simbolo === seleccion)) seleccion = null; return; }
  if (!items.find(i => i.simbolo === seleccion)) seleccion = items.length ? items[0].simbolo : null;
}

const ICONOS = {
  "Hoy": ['<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', "Hoy"],
  "Activos": ['<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/>', "Activos"],
  "Índices bursátiles": ['<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>', "Bolsa"],
  "Bonos y tipos": ['<path d="M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M2 10l10-6 10 6"/>', "Bonos"],
  "Empresas": ['<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>', "Empresas"]
};

function pintarTabs() {
  const cont = document.getElementById("tabs");
  cont.innerHTML = "";
  secciones.forEach((s, k) => {
    const [svg, texto] = ICONOS[s.nombre] || ['<circle cx="12" cy="12" r="8"/>', s.nombre];
    const b = document.createElement("button");
    b.innerHTML = '<svg viewBox="0 0 24 24">' + svg + "</svg><span>" + texto + "</span>";
    b.className = k === iSec ? "on" : "";
    b.onclick = () => { iSec = k; comparar = false; elegirPorDefecto(); refrescar(); window.scrollTo(0, 0); };
    cont.appendChild(b);
  });
}

// Mini-gráfico de tendencia de cada tarjeta (últimos 30 datos)
function spark(u) {
  const i = simbolos.indexOf(u.simbolo), base = baseFilas(), v = [];
  for (let k = base.length - 1; k >= 0 && v.length < 30; k--) {
    const x = base[k].v[i];
    if (x !== null) v.unshift(x);
  }
  if (v.length < 2) return "";
  const min = Math.min(...v), max = Math.max(...v), r = (max - min) || 1;
  const pts = v.map((x, k) => (k / (v.length - 1) * 100).toFixed(1) + "," + (30 - ((x - min) / r) * 26).toFixed(1));
  const col = v[v.length - 1] >= v[0] ? "var(--up)" : "var(--down)";
  return '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><polygon points="0,34 ' + pts.join(" ") +
    ' 100,34" fill="' + col + '" opacity=".12"/><polyline points="' + pts.join(" ") + '" fill="none" stroke="' + col +
    '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}

function pintarMonedas() {
  const cont = document.getElementById("monedas");
  const visible = !!seccion().convertible;
  cont.classList.toggle("hide", !visible);
  cont.innerHTML = "";
  if (!visible) return;
  const fx = (seccion().items.find(i => i.simbolo === "EURUSD=X") || {}).valor;
  [["USD", "Dólares ($)", fx ? "1 $ = " + fmt(1 / fx, 4) + " €" : ""],
   ["EUR", "Euros (€)", fx ? "1 € = " + fmt(fx, 4) + " $" : ""]].forEach(([m, texto, cambio]) => {
    const b = document.createElement("button");
    b.innerHTML = "<span>" + texto + "</span>" + (cambio ? "<small>" + cambio + "</small>" : "");
    b.className = m === moneda ? "on" : "";
    b.onclick = () => { moneda = m; refrescar(); };
    cont.appendChild(b);
  });
}

const pct = (v, aprox, unidad) => (v === null || v === undefined) ? '<span class="num">—</span>' :
  '<span class="num ' + (v >= 0 ? "up" : "down") + '">' + (v >= 0 ? "+" : "") + fmt(v, 1) + (unidad || "%") + (aprox ? "*" : "") + "</span>";

const serieDe = i => { const s = []; filas.forEach(r => { if (r.v[i] !== null) s.push({f: r.f, x: r.v[i]}); }); return s; };
const antes = (serie, f) => { let r = null; for (const p of serie) { if (p.f <= f) r = p; else break; } return r; };

// YTD, 1 año y rendimiento relativo frente al IBEX 35 (mismo periodo que el YTD)
function metricas(simbolo) {
  const serie = serieDe(simbolos.indexOf(simbolo));
  if (serie.length < 2) return {ytd: null, anio: null, rel: null};
  const ult = serie[serie.length - 1], anio = ult.f.slice(0, 4);
  let base = antes(serie, (Number(anio) - 1) + "-12-31"), aprox = false;
  if (!base) { base = serie.find(p => p.f.slice(0, 4) === anio); aprox = true; }
  const ytd = base && base.f !== ult.f ? (ult.x / base.x - 1) * 100 : null;
  const hace = antes(serie, (Number(anio) - 1) + ult.f.slice(4));
  let rel = null;
  const ib = simbolos.indexOf("^IBEX");
  if (ytd !== null && ib >= 0) {
    const si = serieDe(ib), b0 = antes(si, base.f), b1 = antes(si, ult.f);
    if (b0 && b1 && b0.f !== b1.f) rel = ytd - (b1.x / b0.x - 1) * 100;
  }
  return {ytd, ytdAprox: aprox && ytd !== null, anio: hace ? (ult.x / hace.x - 1) * 100 : null, rel};
}

let orden = {col: null, dir: 1};
const COLS = [["nombre", "Empresa"], ["precio", "Precio"], ["ytd", "YTD"], ["anio", "1 año"], ["rel", "vs IBEX"]];

function botonEditar() {
  const d = document.createElement("div");

function pintarLista(cont, items) {
  cont.appendChild(botonEditar());

  if (sinDatos.length) {
    const a = document.createElement("div");
    a.className = "aviso";
    a.textContent = "⚠ Sin datos: " + sinDatos.join(", ") + ". Toca «Editar lista» para corregir el ticker.";
    cont.appendChild(a);
  }
  const ms = {};
  items.forEach(u => { ms[u.simbolo] = metricas(u.simbolo); });

  const cab = document.createElement("div");
  cab.className = "cab";
  COLS.forEach(([c, texto]) => {
    const sp = document.createElement("span");
    const activo = orden.col === c;
    const flecha = c === "nombre" ? (orden.dir === 1 ? " ▲" : " ▼") : (orden.dir === 1 ? " ▼" : " ▲");
    sp.textContent = texto + (activo ? flecha : "");
    if (c !== "precio") {
      sp.className = "ord" + (activo ? " act" : "");

        if (orden.col !== c) orden = {col: c, dir: 1};
        else if (orden.dir === 1) orden.dir = -1;
        else orden = {col: null, dir: 1};
        refrescar();
      };
    }
    cab.appendChild(sp);
  });
  cont.appendChild(cab);

  const ordenar = lista => {
    if (!orden.col) return lista;
    return lista.slice().sort((a, b) => {
      if (orden.col === "nombre") return orden.dir * a.nombre.localeCompare(b.nombre, "es");
      const va = ms[a.simbolo][orden.col], vb = ms[b.simbolo][orden.col];
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      return orden.dir * (vb - va);
    });
  };

  const grupos = [];
  items.forEach(u => { const g = u.grupo || "Otras"; if (!grupos.includes(g)) grupos.push(g); });
  let n = 0;

        '<span class="num">' + fmt(u.valor, 2) + simboloDe(u) + '<small class="' + cls + '">' +
        (u.variacion >= 0 ? "+" : "") + fmt(u.variacion, 2) + " %</small></span>" +
        pct(m.ytd, m.ytdAprox) + pct(m.anio, false) + pct(m.rel, false, "pp");
      fila.onclick = () => { seleccion = seleccion === u.simbolo ? null : u.simbolo; comparar = false; refrescar(); };
      cont.appendChild(fila);
      if (u.simbolo === seleccion) fila.after(document.getElementById("detalle"));
    });

  nota.className = "nota";
  nota.textContent = "Toca una cabecera para ordenar. YTD: desde el último cierre del año anterior. vs IBEX: diferencia del YTD frente al IBEX 35, en puntos (pp). * Desde su salida a bolsa. — Sin histórico suficiente.";

function filasRango() {
  const base = baseFilas();
  if (!base.length) return [];
  const fin = new Date(base[base.length - 1].f);

  const corte = fin.toISOString().slice(0, 10);
  return base.filter(r => r.f >= corte);
}

function pintarGrafico() {
  const items = itemsVista();
  const detalle = document.getElementById("detalle");
  detalle.classList.toggle("hide", !items.length || (esLista() && !seleccion));
  if (grafico) { grafico.destroy(); grafico = null; }

  btn.textContent = comparar ? "Volver a un solo indicador" : "Comparar todos los de esta sección";

  const datos = filasRango();
  const etiquetas = datos.map(r => r.f);
  const estilo = getComputedStyle(document.documentElement);
  const colTexto = estilo.getPropertyValue("--muted").trim();
  const colLinea = estilo.getPropertyValue("--line").trim();
  const esTasa = seccion().tasa;
  let datasets, decimales = 2, unidad = esTasa ? " %" : "";

  if (comparar) {
    datasets = items.map((u, k) => {
      const i = simbolos.indexOf(u.simbolo);
      const serie = datos.map(r => r.v[i]);
      const base = serie.find(x => x !== null);
      return {
        label: u.nombre,
        data: serie.map(x => x === null ? null : (esTasa ? x : (x / base) * 100)),
        borderColor: COLORES[k % COLORES.length],
        borderWidth: 2, tension: 0.25, pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 20, spanGaps: true
      };
    });
  } else {
    const i = simbolos.indexOf(seleccion);
    const u = items.find(x => x.simbolo === seleccion);
    decimales = (u && u.decimales) || 2;
    unidad = u ? simboloDe(u) : "";
    const serie = datos.map(r => r.v[i]);
    const validos = serie.filter(x => x !== null);
    const sube = validos.length < 2 || validos[validos.length - 1] >= validos[0];
    const col = estilo.getPropertyValue(sube ? "--up" : "--down").trim();
    datasets = [{
      label: u ? u.nombre : seleccion,
      data: serie,
      borderColor: col, borderWidth: 2.5, tension: 0.25,
      pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 20, pointBackgroundColor: col,
      spanGaps: true, fill: true,
      backgroundColor: c => {
        const a = c.chart.chartArea;
        if (!a) return col + "22";
        const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
        g.addColorStop(0, col + "55");
        g.addColorStop(1, col + "00");
        return g;
      }
    }];
  }

  const lectura = document.getElementById("lectura");
  const hayDato = (ds, k) => ds.data[k] !== null && ds.data[k] !== undefined;
  const ultimoDato = () => {
    for (let k = datos.length - 1; k >= 0; k--) if (datasets.some(ds => hayDato(ds, k))) return k;
    return datos.length - 1;
  };
  const mostrar = (k, activo) => {
    if (k < 0 || !datos[k]) { lectura.textContent = ""; return; }
    const partes = datasets.filter(ds => hayDato(ds, k))
      .map(ds => (comparar ? ds.label + " " : "") + fmt(ds.data[k], decimales) + unidad);
    lectura.textContent = (activo ? "" : "Último dato · ") + fechaLarga(datos[k].f) + "  ·  " + partes.join("  ·  ");
  };
  mostrar(ultimoDato(), false);

  grafico = new Chart(document.getElementById("grafico"), {
    type: "line",
    data: {labels: etiquetas, datasets},
    plugins: [cruz],
    options: {
      responsive: true, maintainAspectRatio: false, animation: {duration: 600, easing: "easeOutCubic"},
      interaction: {mode: "index", intersect: false},
      onHover: (ev, els) => mostrar(els.length ? els[0].index : ultimoDato(), els.length > 0),
      plugins: {
        cruz: {color: colTexto},
        legend: {display: comparar, labels: {color: colTexto, boxWidth: 12}},
        tooltip: {
          displayColors: comparar, padding: 10,
          callbacks: {
            title: it => fechaLarga(it[0].label),
            label: c => c.dataset.label + ": " + fmt(c.parsed.y, decimales) + unidad
          }
        }
      },
      scales: {
        x: {ticks: {color: colTexto, maxTicksLimit: 5, maxRotation: 0}, grid: {display: false}},
        y: {ticks: {color: colTexto}, grid: {color: colLinea}}
      }
    }
  });
}

const ls = {

  set: (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
};
const aB64 = t => btoa(unescape(encodeURIComponent(t)));
const deB64 = t => decodeURIComponent(escape(atob(t.replace(/\s/g, ""))));
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const repoActual = () => {
  const g = ls.get("repo");
  if (g) return g;
  const p = location.pathname.split("/")[1];
  return (location.hostname.endsWith(".github.io") && p) ? location.hostname.split(".")[0] + "/" + p : "";
};
const apiUrl = () => "https://api.github.com/repos/" + repoActual() + "/contents/empresas.json";
const cabeceras = () => ({"Authorization": "Bearer " + ls.get("token"), "Accept": "application/vnd.github+json"});
const seccionEmpresas = () => secciones.find(s => s.nombre === "Empresas") || {items: []};
const tickersActuales = () => seccionEmpresas().items.map(i => i.simbolo);
const listaActual = () => seccionEmpresas().items.map(i => ({ticker: i.simbolo, nombre: i.nombre, grupo: i.grupo || "Otras"}));
let ed = {borrador: [], sha: null, msg: "", ocupado: false, cargado: false, q: "", sel: null, resultados: [], buscando: false, sinBusqueda: false}, sondeo = null;

function errorGitHub(status) {
  if (status === 401) return "El token no es válido o ha caducado.";
  if (status === 403 || status === 404) return "El token no tiene permiso para escribir en este repositorio (revisa Contents: Read and write).";
  if (status === 409 || status === 422) return "La lista cambió mientras la editabas. Ciérrala y ábrela de nuevo.";
  return "Error de GitHub (" + status + ").";
}

async function abrirEditor() {
  document.getElementById("editor").classList.remove("hide");
  ed.msg = ""; ed.cargado = false; ed.sel = null; ed.q = ""; ed.resultados = [];
  if (!ls.get("token")) { pintarEditor(); return; }
  await cargarBorrador();
}

async function cargarBorrador() {
  if (!repoActual()) { ed.msg = "Indica el repositorio (usuario/repositorio)."; ls.set("token", ""); pintarEditor(); return; }
  ed.ocupado = true; ed.cargado = false; ed.msg = "Cargando…"; pintarEditor();
  try {
    const r = await fetch(apiUrl(), {headers: cabeceras(), cache: "no-store"});
    if (r.status === 404) { ed.sha = null; ed.borrador = listaActual(); }
    else if (!r.ok) throw new Error(errorGitHub(r.status));
    else { const j = await r.json(); ed.sha = j.sha; ed.borrador = JSON.parse(deB64(j.content)); }
    ed.cargado = true; ed.msg = "";
  } catch (e) { ed.msg = e.message === "Failed to fetch" ? "No se pudo conectar con GitHub." : e.message; }
  ed.ocupado = false; pintarEditor();
}

async function guardarLista(nueva, texto) {
  const previa = ed.borrador;
  ed.ocupado = true; ed.msg = "Guardando…"; pintarEditor();
  try {
    const body = {message: "Actualizar lista de empresas", content: aB64(JSON.stringify(nueva, null, 2) + "\n")};
    if (ed.sha) body.sha = ed.sha;
    const r = await fetch(apiUrl(), {method: "PUT", headers: Object.assign({"Content-Type": "application/json"}, cabeceras()), body: JSON.stringify(body)});
    if (!r.ok) throw new Error(errorGitHub(r.status));
    ed.sha = (await r.json()).content.sha;
    ed.borrador = nueva;
    ed.msg = "✓ " + texto + " Los datos se están actualizando (puede tardar unos minutos); esta pantalla se refrescará sola.";
    seguirActualizacion(new Set(nueva.map(e => e.ticker)));
  } catch (e) {
    ed.borrador = previa;
    ed.msg = e.message === "Failed to fetch" ? "No se pudo conectar con GitHub." : e.message;
  }
  ed.ocupado = false; pintarEditor();
}

// Comprueba cada 15 s si los datos ya reflejan la nueva lista
function seguirActualizacion(deseados) {
  clearInterval(sondeo);
  const t0 = Date.now();
  sondeo = setInterval(async () => {
    try {
      const r = await fetch("data/ultimo.json?" + Date.now(), {cache: "reload"});
      const sec = (await r.json()).secciones.find(s => s.nombre === "Empresas");
      const hay = new Set(sec ? sec.items.map(i => i.simbolo) : []);
      let sin = {};
      try { const ra = await fetch("data/avisos.json?" + Date.now(), {cache: "reload"}); if (ra.ok) sin = (await ra.json()).sin_datos || {}; } catch (e) {}
      if ([...deseados].every(t => hay.has(t) || sin[t]) && [...hay].every(t => deseados.has(t))) {
        clearInterval(sondeo);
        await cargar(true);
        const malos = [...deseados].filter(t => sin[t] && !hay.has(t));
        ed.msg = malos.length ? "Listo, pero no se encontraron datos de " + malos.join(", ") + ". Revisa el ticker." : "✓ Datos actualizados.";
        pintarEditor();
        return;
      }
    } catch (e) {}
    if (Date.now() - t0 > 6 * 60000) {
      clearInterval(sondeo);
      ed.msg = "Aún no se ven todos los cambios. Si falta alguna empresa, comprueba que su ticker exista en Yahoo Finance.";
      pintarEditor();
    }
  }, 15000);
}

const limpiarNombre = n => {
  let t = String(n || "").replace(/,?\s+(S\.?A\.?U?|Inc\.?|Corp(oration)?\.?|Ltd\.?|PLC|N\.?V\.?|AG|SE|Co\.?)$/i, "").trim();
  if (t.length > 5 && t === t.toUpperCase() && !/\d/.test(t)) t = t.charAt(0) + t.slice(1).toLowerCase();
  return t;
};
async function pedir(url, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, {signal: c.signal});
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
let rutaBusqueda = 0, tBusca = null, idBusca = 0;
async function buscarEmpresas(q) {
  const base = "https://query2.finance.yahoo.com/v1/finance/search?quotesCount=10&newsCount=0&listsCount=0&q=" + encodeURIComponent(q);
  const rutas = [u => u, u => "https://corsproxy.io/?url=" + encodeURIComponent(u), u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u)];
  for (let k = 0; k < rutas.length; k++) {
    const i = (rutaBusqueda + k) % rutas.length;
    try {
      const j = await pedir(rutas[i](base), 6000);
      if (j && Array.isArray(j.quotes)) {
        rutaBusqueda = i;
        return j.quotes.filter(x => x.symbol && ["EQUITY", "ETF"].includes(x.quoteType)).slice(0, 8);
      }
    } catch (e) {}
  }
  return null;  // no se pudo consultar
}

const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function buscarLocal(q) {
  const n = norm(q).trim(), t = q.trim().toUpperCase();
  const puntos = d => {
    const nom = norm(d.nombre);
    if (nom.startsWith(n) || d.simbolo === t) return 3;
    if (nom.split(/[\s,.()-]+/).some(w => w.startsWith(n))) return 2;
    if (nom.includes(n) || d.simbolo.startsWith(t)) return 1;
    return 0;
  };
  return DIRECTORIO.map(d => [puntos(d), d]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 8)
    .map(x => ({symbol: x[1].simbolo, shortname: x[1].nombre, exchDisp: x[1].bolsa, quoteType: "EQUITY"}));
}

function alEscribir(valor) {
  ed.q = valor; clearTimeout(tBusca);
  const q = valor.trim(), id = ++idBusca;
  if (q.length < 2) { ed.buscando = false; ed.resultados = []; ed.sinBusqueda = false; pintarResultados(); return; }
  const local = buscarLocal(q);
  ed.resultados = local; ed.sinBusqueda = false; ed.buscando = true; pintarResultados();
  tBusca = setTimeout(async () => {
    const r = await buscarEmpresas(q);
    if (id !== idBusca) return;
    ed.buscando = false; ed.sinBusqueda = r === null;
    if (r) { const vistos = new Set(local.map(x => x.symbol)); ed.resultados = local.concat(r.filter(x => !vistos.has(x.symbol))).slice(0, 10); }
    pintarResultados();
  }, 350);
}

function pintarResultados() {
  const c = document.getElementById("edResultados");
  if (!c) return;
  const q = ed.q.trim();
  if (q.length < 2) { c.innerHTML = ""; return; }
  const ya = new Set(ed.borrador.map(e => e.ticker));
  const t = q.toUpperCase();
  let html = ed.resultados.map((x, i) => '<button class="res" data-r="' + i + '"' + (ya.has(x.symbol) ? " disabled" : "") + "><b>" +
    esc(limpiarNombre(x.shortname || x.longname || x.symbol)) + "</b><small>" + esc(x.symbol) + " · " + esc(x.exchDisp || "") +
    (ya.has(x.symbol) ? " · ya está en la lista" : "") + "</small></button>").join("");
  if (!ed.resultados.length && !ed.buscando) {
    html += '<div class="msgEd">' + (ed.sinBusqueda ? "No está en la lista incluida y no se pudo consultar el buscador en línea." : "Sin resultados para «" + esc(q) + "».") +
      " Si conoces el ticker, escríbelo completo (p. ej. REP.MC).</div>";
    if (!ya.has(t) && (/^[A-Z0-9^=-]{1,5}$/.test(t) || /^[A-Z0-9^=-]{1,8}\.[A-Z]{1,3}$/.test(t)))
      html += '<button class="res" data-t="1"><b>Usar «' + esc(t) + '» como ticker</b><small>Sin comprobar</small></button>';
  }
  if (ed.buscando) html += '<div class="msgEd">Buscando más resultados…</div>';
  c.innerHTML = html;
  c.querySelectorAll("button.res").forEach(b => {
    b.onclick = () => {
      if (b.dataset.t) ed.sel = {ticker: t, nombre: t, bolsa: ""};
      else {
        const x = ed.resultados[Number(b.dataset.r)];
        ed.sel = {ticker: x.symbol, nombre: limpiarNombre(x.shortname || x.longname || x.symbol), bolsa: x.exchDisp || ""};
      }
      pintarEditor();
    };
  });
}

function pintarEditor() {
  const c = document.getElementById("edCuerpo");
  const msg = ed.msg ? '<div class="msgEd">' + esc(ed.msg) + "</div>" : "";
  if (!ls.get("token")) {
    c.innerHTML = '<p class="msgEd">Para editar la lista desde aquí hace falta un <b>token</b> de GitHub. Se crea una sola vez y se guarda solo en este dispositivo.</p>' +
      '<ol class="pasos"><li>Abre <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li>' +
      "<li>Nombre: <i>App índices</i>. Caducidad: la más larga. En <i>Repository access</i> elige <i>Only select repositories</i> y marca tu repositorio.</li>" +
      "<li>En <i>Permissions → Repository permissions</i> pon <i>Contents</i> en <i>Read and write</i>.</li>" +
      "<li>Pulsa <i>Generate token</i>, copia el código (empieza por github_pat_) y pégalo aquí.</li></ol>" + msg +
      '<input id="edToken" type="password" autocomplete="off" placeholder="Pega aquí el token">' +
      (repoActual() ? "" : '<input id="edRepo" placeholder="usuario/repositorio">') +
      '<button class="btn" id="edGuardarToken">Guardar token</button>';
    document.getElementById("edGuardarToken").onclick = async () => {
      const t = document.getElementById("edToken").value.trim();
      const rp = document.getElementById("edRepo") ? document.getElementById("edRepo").value.trim() : "";
      if (!t) { ed.msg = "Pega el token."; pintarEditor(); return; }
      ls.set("token", t); if (rp) ls.set("repo", rp);
      await cargarBorrador();
    };
    return;
  }
  const actuales = new Set(tickersActuales());
  const filasEd = ed.borrador.map((e, i) => {
    const av = avisos[e.ticker], hay = actuales.has(e.ticker);
    const estado = hay ? "" : (av ? " · ⚠ sin datos" : " · pendiente de actualizar");
    const sug = (!hay && av && av.sugerencias ? av.sugerencias : []).filter(x => !ed.borrador.some(b => b.ticker === x.symbol))
      .map(x => '<button class="res" data-fix="' + i + '" data-s="' + esc(x.symbol) + '"><b>¿Es «' + esc(limpiarNombre(x.nombre)) + '»?</b><small>Usar ' +
        esc(x.symbol) + (x.bolsa ? " · " + esc(x.bolsa) : "") + "</small></button>").join("");
    return '<div class="edfila"><div class="i"><b>' + esc(e.nombre) + "</b><small>" + esc(e.ticker) + " · " + esc(e.grupo || "Otras") + estado +
      '</small></div><button data-i="' + i + '" aria-label="Eliminar">🗑</button></div>' + sug;
  }).join("");
  let grupos = [...new Set(ed.borrador.map(e => e.grupo || "Otras"))];
  if (!grupos.length) grupos = ["Otras"];
  let anadir;
  if (ed.sel) {
    anadir = '<div class="edsel"><div class="i"><b>' + esc(ed.sel.nombre) + "</b><small>" + esc(ed.sel.ticker) + (ed.sel.bolsa ? " · " + esc(ed.sel.bolsa) : "") +
      '</small></div><button id="edCambiar" aria-label="Cambiar">✕</button></div>' +
      '<select id="edGrupoSel">' + grupos.map(g => '<option value="' + esc(g) + '">' + esc(g) + "</option>").join("") + '<option value="__nuevo">➕ Nuevo grupo…</option></select>' +
      '<input id="edGrupoNuevo" class="hide" placeholder="Nombre del nuevo grupo">' +
      '<button class="btn" id="edAnadir"' + (ed.cargado && !ed.ocupado ? "" : " disabled") + ">Añadir y actualizar datos</button>";
  } else {
    anadir = '<input id="edBuscar" placeholder="Nombre de la empresa o ticker (p. ej. Iberdrola, AAPL)" autocomplete="off" value="' + esc(ed.q) + '"><div id="edResultados"></div>';
  }
  c.innerHTML = msg + (ed.cargado ? (filasEd || '<p class="msgEd">La lista está vacía.</p>') : "") +
    '<div class="grupo">Añadir empresa</div>' + (ed.cargado ? anadir : "") +
    '<button class="enlace" id="edQuitar">Quitar el token de este dispositivo</button>';
  c.querySelectorAll("button[data-i]").forEach(b => {
    b.onclick = () => {
      if (ed.ocupado) return;
      const e = ed.borrador[Number(b.dataset.i)];
      if (!confirm("¿Quitar " + e.nombre + " de la lista?")) return;
      guardarLista(ed.borrador.filter((_, k) => k !== Number(b.dataset.i)), e.nombre + " eliminada.");
    };
  });
  c.querySelectorAll("button[data-fix]").forEach(b => {
    b.onclick = () => {
      if (ed.ocupado) return;
      const i = Number(b.dataset.fix);
      guardarLista(ed.borrador.map((e, k) => k === i ? Object.assign({}, e, {ticker: b.dataset.s}) : e), "Ticker corregido.");
    };
  });
  if (ed.sel) {
    const sel = document.getElementById("edGrupoSel"), nuevo = document.getElementById("edGrupoNuevo");
    sel.onchange = () => nuevo.classList.toggle("hide", sel.value !== "__nuevo");
    document.getElementById("edCambiar").onclick = () => { ed.sel = null; pintarEditor(); };
    document.getElementById("edAnadir").onclick = () => {
      const g = sel.value === "__nuevo" ? nuevo.value.trim() : sel.value;
      if (!g) { ed.msg = "Escribe el nombre del grupo."; pintarEditor(); return; }
      if (ed.borrador.some(e => e.ticker === ed.sel.ticker)) { ed.msg = "Ese ticker ya está en la lista."; ed.sel = null; pintarEditor(); return; }
      const nueva = ed.borrador.concat([{ticker: ed.sel.ticker, nombre: ed.sel.nombre, grupo: g}]);
      const nombre = ed.sel.nombre;
      ed.sel = null; ed.q = ""; ed.resultados = []; ed.sinBusqueda = false;
      guardarLista(nueva, nombre + " añadida.");
    };
  } else if (ed.cargado) {
    const caja = document.getElementById("edBuscar");
    caja.oninput = () => alEscribir(caja.value);
    pintarResultados();
  }
  document.getElementById("edQuitar").onclick = () => { ls.set("token", ""); ed.borrador = []; ed.cargado = false; ed.msg = ""; pintarEditor(); };
}

const cerrarEditor = () => document.getElementById("editor").classList.add("hide");
document.getElementById("edCerrar").onclick = cerrarEditor;
document.getElementById("editor").onclick = e => { if (e.target.id === "editor") cerrarEditor(); };

// ---------- Tirar hacia abajo para actualizar ----------
let cargando = false;
const ptr = document.getElementById("ptr");
function mostrarPtr(texto, y) {
  ptr.textContent = texto;
  ptr.style.transform = "translate(-50%," + y + "px)";
  ptr.style.opacity = 1;
}
function ocultarPtr() {
  ptr.style.transition = "transform .25s, opacity .25s";
  ptr.style.transform = "translate(-50%,-70px)";
  ptr.style.opacity = 0;
}
async function actualizar() {
  cargando = true;
  ptr.style.transition = "transform .25s, opacity .25s";
  mostrarPtr("Actualizando…", 6);
  const ok = await cargar(true);
  mostrarPtr(ok ? "✓ " + document.getElementById("sub").textContent : "No se pudo actualizar", 6);
  setTimeout(() => { ocultarPtr(); cargando = false; }, 1600);
}
(function () {
  const UMBRAL = 70;
  let y0 = null, dy = 0, tirando = false;
  const editorAbierto = () => !document.getElementById("editor").classList.contains("hide");
  document.addEventListener("touchstart", e => {
    if (window.scrollY > 0 || e.touches.length !== 1 || cargando || editorAbierto() || e.target.closest("canvas")) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; tirando = false;
  }, {passive: true});
  document.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0 && window.scrollY <= 0) {
      tirando = true;
      if (e.cancelable) e.preventDefault();
      ptr.style.transition = "none";
      mostrarPtr(dy > UMBRAL ? "Suelta para actualizar" : "Tira para actualizar", Math.min(dy * 0.5, 80) - 70);
      ptr.style.opacity = Math.min(1, dy / UMBRAL);
    } else if (tirando) { tirando = false; ocultarPtr(); }
  }, {passive: false});
  document.addEventListener("touchend", () => {
    if (y0 === null) return;
    const listo = tirando && dy > UMBRAL;
    y0 = null; tirando = false;
    if (listo) actualizar(); else ocultarPtr();
  });
})();

document.getElementById("todos").onclick = () => { comparar = !comparar; refrescar(); };
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data === "datos-nuevos" && !cargando) cargar(); });
}
