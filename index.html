<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Índices">
<title>Índices financieros</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f5f8;--card:#ffffff;--text:#0f172a;--muted:#6b7280;--up:#16a34a;--down:#dc2626;--accent:#2563eb;--line:#e5e7eb;--sombra:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06)}
@media (prefers-color-scheme: dark){:root{--bg:#0b1120;--card:#161f33;--text:#f1f5f9;--muted:#94a3b8;--up:#4ade80;--down:#f87171;--accent:#60a5fa;--line:#26324a;--sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:8px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:4px 2px;transition:color .2s}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{transform:translateY(-2px) scale(1.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1.5px solid transparent;border-radius:18px;padding:12px 12px 8px;cursor:pointer;text-align:left;color:inherit;font:inherit;box-shadow:var(--sombra);animation:aparece .4s ease both;transition:transform .15s,border-color .2s}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--accent)}
.card .n{font-size:12px;color:var(--muted);font-weight:500}
.card .v{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
.card .c{display:inline-block;font-size:12px;font-weight:700;margin-top:5px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent)}
.card svg.spark{display:block;width:100%;height:34px;margin-top:6px}
.card .d{font-size:11px;color:var(--muted);margin-top:2px}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.up{color:var(--up)}.down{color:var(--down)}
.bar,.monedas{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:14px;box-shadow:var(--sombra)}
.bar{margin:18px 0 10px}
.monedas{margin-bottom:14px}
.bar button,.monedas button{flex:1;min-width:0;padding:8px 6px;border:0;background:none;color:var(--muted);border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.bar button.on,.monedas button.on{background:var(--accent);color:#fff}
.lectura{background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:10px;font-size:14px;font-weight:600;min-height:42px;line-height:1.4;box-shadow:var(--sombra)}
.chart{background:var(--card);border-radius:18px;padding:12px;height:340px;position:relative;box-shadow:var(--sombra)}
.chart canvas{touch-action:pan-y}
.pista{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
.all{width:100%;margin-top:12px;padding:12px;border:0;background:var(--card);color:var(--accent);border-radius:14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--sombra)}
.all.on{background:var(--accent);color:#fff}
.msg{padding:24px;color:var(--muted);text-align:center;grid-column:1/-1}
.lista{display:block}
.cab,.fila{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1.1fr) repeat(3,minmax(0,.85fr));gap:4px;align-items:center}
.cab{padding:0 12px 6px;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.cab .ord{cursor:pointer}
.cab .act{color:var(--accent)}
.grupo{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 8px}
.cab span:not(:first-child){text-align:right}
.fila{width:100%;background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--sombra);color:inherit;font:inherit;text-align:left;cursor:pointer;animation:aparece .4s ease both;transition:transform .15s,border-color .2s}
.fila:active{transform:scale(.98)}
.fila.sel{border-color:var(--accent)}
.fila .nom b{display:block;font-size:14px}
.fila .nom small{color:var(--muted);font-size:11px}
.fila .num{text-align:right;font-size:12px;font-weight:700}
.fila .num small{display:block;font-size:11px;font-weight:600}
.nota{color:var(--muted);font-size:11px;margin:4px 2px 12px}
#detalle{margin-bottom:12px}
.hide{display:none}
</style>
</head>
<body>
<h1>Índices financieros</h1>
<div class="sub" id="sub">Cargando…</div>
<div class="tabs" id="tabs"></div>
<div class="monedas hide" id="monedas"></div>
<div class="grid" id="cards"></div>
<div id="detalle">
  <div class="bar" id="rangos"></div>
  <div class="lectura" id="lectura"></div>
  <div class="chart"><canvas id="grafico"></canvas></div>
  <div class="pista">Pasa el cursor o desliza el dedo por el gráfico para ver la fecha y el valor.</div>
  <button class="all" id="todos">Comparar todos los de esta sección</button>
</div>

<script>
const COLORES = ["#2563eb","#16a34a","#dc2626","#f59e0b","#9333ea","#0891b2","#db2777","#65a30d"];
const RANGOS = {"1M":30,"6M":182,"1A":365,"5A":1825,"Máx":99999};
let secciones = [], simbolos = [], filas = [];
let iSec = 0, seleccion = null, rango = "1A", comparar = false, grafico = null;
let moneda = "USD", filasEUR = [];

const fmt = (n, d = 2) => n.toLocaleString("es-ES", {maximumFractionDigits: d});
const fechaCorta = f => f.slice(8, 10) + "/" + f.slice(5, 7);
const fechaLarga = f => new Date(f + "T00:00:00").toLocaleDateString("es-ES", {day: "numeric", month: "short", year: "numeric"});
const simboloDe = u => u.tasa ? " %" : (u.moneda === "USD" ? " $" : (u.moneda === "EUR" ? " €" : ""));

// Línea vertical que acompaña al cursor o al dedo
const cruz = {
  id: "cruz",
  afterDatasetsDraw(chart) {
    const act = chart.tooltip ? chart.tooltip.getActiveElements() : [];
    if (!act.length) return;
    const x = act[0].element.x, a = chart.chartArea, ctx = chart.ctx;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x, a.top); ctx.lineTo(x, a.bottom);
    ctx.lineWidth = 1; ctx.strokeStyle = chart.options.plugins.cruz.color;
    ctx.stroke(); ctx.restore();
  }
};
const seccion = () => secciones[iSec] || {items: []};
const esLista = () => seccion().nombre === "Empresas";
const enEuros = () => moneda === "EUR" && seccion().convertible;
const baseFilas = () => enEuros() ? filasEUR : filas;

// Convierte a euros los activos marcados como convertibles (dólares / EURUSD)
function prepararEUR() {
  const fxIdx = simbolos.indexOf("EURUSD=X");
  const conv = new Set(secciones.flatMap(s => s.items.filter(i => i.convertible).map(i => i.simbolo)));
  let fx = null;
  filasEUR = filas.map(r => {
    const v = r.v.slice();
    if (fxIdx >= 0 && r.v[fxIdx] !== null) fx = r.v[fxIdx];
    simbolos.forEach((s, i) => {
      if (conv.has(s)) v[i] = (v[i] !== null && fx) ? v[i] / fx : null;
    });
    return {f: r.f, v};
  });
}

// Tarjetas de la sección actual, con valores en euros si procede
function itemsVista() {
  return seccion().items.map(u => {
    if (!(enEuros() && u.convertible)) return u;
    const i = simbolos.indexOf(u.simbolo);
    const pts = [];
    for (let k = filasEUR.length - 1; k >= 0 && pts.length < 2; k--) {
      const x = filasEUR[k].v[i];
      if (x !== null) pts.push({f: filasEUR[k].f, x});
    }
    if (pts.length < 2) return null;
    return Object.assign({}, u, {valor: pts[0].x, fecha: pts[0].f,
      variacion: (pts[0].x / pts[1].x - 1) * 100, moneda: "EUR"});
  }).filter(Boolean);
}

async function cargar() {
  try {
    const t = Date.now();
    const [r1, r2] = await Promise.all([
      fetch("data/ultimo.json?" + t),
      fetch("data/historico.csv?" + t)
    ]);
    if (!r1.ok || !r2.ok) throw new Error("No se encuentran los datos");
    secciones = (await r1.json()).secciones;
    const lineas = (await r2.text()).trim().split("\n");
    simbolos = lineas[0].split(",").slice(1);
    filas = lineas.slice(1).map(l => {
      const p = l.split(",");
      return {f: p[0], v: p.slice(1).map(x => x === "" ? null : parseFloat(x))};
    });
    const fechas = secciones.flatMap(s => s.items.map(i => i.fecha)).sort();
    document.getElementById("sub").textContent =
      fechas.length ? "Datos hasta el " + fechas[fechas.length - 1] : "";
    prepararEUR();
    iSec = Math.max(0, secciones.findIndex(s => s.items.length));
    elegirPorDefecto();
    refrescar();
  } catch (e) {
    document.getElementById("sub").textContent = "";
    document.getElementById("cards").innerHTML = '<div class="msg">No se han podido cargar los datos.</div>';
  }
}

function elegirPorDefecto() {
  const items = seccion().items;
  if (esLista()) { if (!items.find(i => i.simbolo === seleccion)) seleccion = null; return; }
  if (!items.find(i => i.simbolo === seleccion)) seleccion = items.length ? items[0].simbolo : null;
}

const ICONOS = {
  "Activos": ['<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/>', "Activos"],
  "Índices bursátiles": ['<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>', "Bolsa"],
  "Bonos y tipos": ['<path d="M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M2 10l10-6 10 6"/>', "Bonos"],
  "Empresas": ['<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>', "Empresas"]
};

function pintarTabs() {
  const cont = document.getElementById("tabs");
  cont.innerHTML = "";
  secciones.forEach((s, k) => {
    const [svg, texto] = ICONOS[s.nombre] || ['<circle cx="12" cy="12" r="8"/>', s.nombre];
    const b = document.createElement("button");
    b.innerHTML = '<svg viewBox="0 0 24 24">' + svg + "</svg><span>" + texto + "</span>";
    b.className = k === iSec ? "on" : "";
    b.onclick = () => { iSec = k; comparar = false; elegirPorDefecto(); refrescar(); window.scrollTo(0, 0); };
    cont.appendChild(b);
  });
}

// Mini-gráfico de tendencia de cada tarjeta (últimos 30 datos)
function spark(u) {
  const i = simbolos.indexOf(u.simbolo), base = baseFilas(), v = [];
  for (let k = base.length - 1; k >= 0 && v.length < 30; k--) {
    const x = base[k].v[i];
    if (x !== null) v.unshift(x);
  }
  if (v.length < 2) return "";
  const min = Math.min(...v), max = Math.max(...v), r = (max - min) || 1;
  const pts = v.map((x, k) => (k / (v.length - 1) * 100).toFixed(1) + "," + (30 - ((x - min) / r) * 26).toFixed(1));
  const col = v[v.length - 1] >= v[0] ? "var(--up)" : "var(--down)";
  return '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><polygon points="0,34 ' + pts.join(" ") +
    ' 100,34" fill="' + col + '" opacity=".12"/><polyline points="' + pts.join(" ") + '" fill="none" stroke="' + col +
    '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}

function pintarMonedas() {
  const cont = document.getElementById("monedas");
  const visible = !!seccion().convertible;
  cont.classList.toggle("hide", !visible);
  cont.innerHTML = "";
  if (!visible) return;
  [["USD", "Dólares ($)"], ["EUR", "Euros (€)"]].forEach(([m, texto]) => {
    const b = document.createElement("button");
    b.textContent = texto;
    b.className = m === moneda ? "on" : "";
    b.onclick = () => { moneda = m; refrescar(); };
    cont.appendChild(b);
  });
}

const pct = (v, aprox, unidad) => (v === null || v === undefined) ? '<span class="num">—</span>' :
  '<span class="num ' + (v >= 0 ? "up" : "down") + '">' + (v >= 0 ? "+" : "") + fmt(v, 1) + (unidad || "%") + (aprox ? "*" : "") + "</span>";

const serieDe = i => { const s = []; filas.forEach(r => { if (r.v[i] !== null) s.push({f: r.f, x: r.v[i]}); }); return s; };
const antes = (serie, f) => { let r = null; for (const p of serie) { if (p.f <= f) r = p; else break; } return r; };

// YTD, 1 año y rendimiento relativo frente al IBEX 35 (mismo periodo que el YTD)
function metricas(simbolo) {
  const serie = serieDe(simbolos.indexOf(simbolo));
  if (serie.length < 2) return {ytd: null, anio: null, rel: null};
  const ult = serie[serie.length - 1], anio = ult.f.slice(0, 4);
  let base = antes(serie, (Number(anio) - 1) + "-12-31"), aprox = false;
  if (!base) { base = serie.find(p => p.f.slice(0, 4) === anio); aprox = true; }
  const ytd = base && base.f !== ult.f ? (ult.x / base.x - 1) * 100 : null;
  const hace = antes(serie, (Number(anio) - 1) + ult.f.slice(4));
  let rel = null;
  const ib = simbolos.indexOf("^IBEX");
  if (ytd !== null && ib >= 0) {
    const si = serieDe(ib), b0 = antes(si, base.f), b1 = antes(si, ult.f);
    if (b0 && b1 && b0.f !== b1.f) rel = ytd - (b1.x / b0.x - 1) * 100;
  }
  return {ytd, ytdAprox: aprox && ytd !== null, anio: hace ? (ult.x / hace.x - 1) * 100 : null, rel};
}

let orden = {col: null, dir: 1};
const COLS = [["nombre", "Empresa"], ["precio", "Precio"], ["ytd", "YTD"], ["anio", "1 año"], ["rel", "vs IBEX"]];

function pintarLista(cont, items) {
  const ms = {};
  items.forEach(u => { ms[u.simbolo] = metricas(u.simbolo); });

  const cab = document.createElement("div");
  cab.className = "cab";
  COLS.forEach(([c, texto]) => {
    const sp = document.createElement("span");
    const activo = orden.col === c;
    const flecha = c === "nombre" ? (orden.dir === 1 ? " ▲" : " ▼") : (orden.dir === 1 ? " ▼" : " ▲");
    sp.textContent = texto + (activo ? flecha : "");
    if (c !== "precio") {
      sp.className = "ord" + (activo ? " act" : "");
      sp.onclick = () => {
        if (orden.col !== c) orden = {col: c, dir: 1};
        else if (orden.dir === 1) orden.dir = -1;
        else orden = {col: null, dir: 1};
        refrescar();
      };
    }
    cab.appendChild(sp);
  });
  cont.appendChild(cab);

  const ordenar = lista => {
    if (!orden.col) return lista;
    return lista.slice().sort((a, b) => {
      if (orden.col === "nombre") return orden.dir * a.nombre.localeCompare(b.nombre, "es");
      const va = ms[a.simbolo][orden.col], vb = ms[b.simbolo][orden.col];
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      return orden.dir * (vb - va);
    });
  };

  const grupos = [];
  items.forEach(u => { const g = u.grupo || "Otras"; if (!grupos.includes(g)) grupos.push(g); });
  let n = 0;
  grupos.forEach(g => {
    const t = document.createElement("div");
    t.className = "grupo";
    t.textContent = g;
    cont.appendChild(t);
    ordenar(items.filter(u => (u.grupo || "Otras") === g)).forEach(u => {
      const m = ms[u.simbolo];
      const fila = document.createElement("button");
      fila.className = "fila" + (u.simbolo === seleccion ? " sel" : "");
      fila.style.animationDelay = (n++ * 40) + "ms";
      const cls = u.variacion >= 0 ? "up" : "down";
      fila.innerHTML = '<span class="nom"><b>' + u.nombre + "</b><small>" + u.simbolo + "</small></span>" +
        '<span class="num">' + fmt(u.valor, 2) + simboloDe(u) + '<small class="' + cls + '">' +
        (u.variacion >= 0 ? "+" : "") + fmt(u.variacion, 2) + " %</small></span>" +
        pct(m.ytd, m.ytdAprox) + pct(m.anio, false) + pct(m.rel, false, "pp");
      fila.onclick = () => { seleccion = seleccion === u.simbolo ? null : u.simbolo; comparar = false; refrescar(); };
      cont.appendChild(fila);
      if (u.simbolo === seleccion) fila.after(document.getElementById("detalle"));
    });
  });

  const nota = document.createElement("div");
  nota.className = "nota";
  nota.textContent = "Toca una cabecera para ordenar. YTD: desde el último cierre del año anterior. vs IBEX: diferencia del YTD frente al IBEX 35, en puntos (pp). * Desde su salida a bolsa. — Sin histórico suficiente.";
  cont.appendChild(nota);
}

function pintarTarjetas() {
  const cont = document.getElementById("cards");
  cont.after(document.getElementById("detalle"));
  cont.className = esLista() ? "lista" : "grid";
  cont.innerHTML = "";
  const items = itemsVista();
  if (!items.length) {
    cont.innerHTML = '<div class="msg">Todavía no hay datos en esta sección.' +
      (seccion().nombre === "Empresas" ? "<br>Añade empresas en actualizar_datos.py." : "") + "</div>";
    return;
  }
  if (esLista()) { pintarLista(cont, items); return; }
  items.forEach((u, k) => {
    const b = document.createElement("button");
    b.style.animationDelay = (k * 40) + "ms";
    b.className = "card" + (!comparar && u.simbolo === seleccion ? " sel" : "");
    const cls = u.variacion >= 0 ? "up" : "down";
    const signo = u.variacion >= 0 ? "+" : "";
    const valor = fmt(u.valor, u.decimales || 2) + simboloDe(u);
    const delta = signo + fmt(u.variacion, u.tasa ? 1 : 2) + (u.tasa ? " pb" : " %");
    b.innerHTML = '<div class="n">' + u.nombre + '</div><div class="v">' + valor +
      '</div><div class="c ' + cls + '">' + delta + '</div>' + spark(u) + '<div class="d">' + fechaCorta(u.fecha) + "</div>";
    b.onclick = () => { seleccion = u.simbolo; comparar = false; refrescar(); };
    cont.appendChild(b);
  });
}

function pintarRangos() {
  const cont = document.getElementById("rangos");
  cont.innerHTML = "";
  Object.keys(RANGOS).forEach(r => {
    const b = document.createElement("button");
    b.textContent = r;
    b.className = r === rango ? "on" : "";
    b.onclick = () => { rango = r; refrescar(); };
    cont.appendChild(b);
  });
}

function filasRango() {
  const base = baseFilas();
  if (!base.length) return [];
  const fin = new Date(base[base.length - 1].f);
  fin.setDate(fin.getDate() - RANGOS[rango]);
  const corte = fin.toISOString().slice(0, 10);
  return base.filter(r => r.f >= corte);
}

function pintarGrafico() {
  const items = itemsVista();
  const detalle = document.getElementById("detalle");
  detalle.classList.toggle("hide", !items.length || (esLista() && !seleccion));
  if (grafico) { grafico.destroy(); grafico = null; }
  if (!items.length || (esLista() && !seleccion)) return;

  const btn = document.getElementById("todos");
  btn.classList.toggle("hide", items.length < 2 || esLista());
  btn.classList.toggle("on", comparar);
  btn.textContent = comparar ? "Volver a un solo indicador" : "Comparar todos los de esta sección";

  const datos = filasRango();
  const etiquetas = datos.map(r => r.f);
  const estilo = getComputedStyle(document.documentElement);
  const colTexto = estilo.getPropertyValue("--muted").trim();
  const colLinea = estilo.getPropertyValue("--line").trim();
  const esTasa = seccion().tasa;
  let datasets, decimales = 2, unidad = esTasa ? " %" : "";

  if (comparar) {
    datasets = items.map((u, k) => {
      const i = simbolos.indexOf(u.simbolo);
      const serie = datos.map(r => r.v[i]);
      const base = serie.find(x => x !== null);
      return {
        label: u.nombre,
        data: serie.map(x => x === null ? null : (esTasa ? x : (x / base) * 100)),
        borderColor: COLORES[k % COLORES.length],
        borderWidth: 2, tension: 0.25, pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 20, spanGaps: true
      };
    });
  } else {
    const i = simbolos.indexOf(seleccion);
    const u = items.find(x => x.simbolo === seleccion);
    decimales = (u && u.decimales) || 2;
    unidad = u ? simboloDe(u) : "";
    const serie = datos.map(r => r.v[i]);
    const validos = serie.filter(x => x !== null);
    const sube = validos.length < 2 || validos[validos.length - 1] >= validos[0];
    const col = estilo.getPropertyValue(sube ? "--up" : "--down").trim();
    datasets = [{
      label: u ? u.nombre : seleccion,
      data: serie,
      borderColor: col, borderWidth: 2.5, tension: 0.25,
      pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 20, pointBackgroundColor: col,
      spanGaps: true, fill: true,
      backgroundColor: c => {
        const a = c.chart.chartArea;
        if (!a) return col + "22";
        const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
        g.addColorStop(0, col + "55");
        g.addColorStop(1, col + "00");
        return g;
      }
    }];
  }

  const lectura = document.getElementById("lectura");
  const hayDato = (ds, k) => ds.data[k] !== null && ds.data[k] !== undefined;
  const ultimoDato = () => {
    for (let k = datos.length - 1; k >= 0; k--) if (datasets.some(ds => hayDato(ds, k))) return k;
    return datos.length - 1;
  };
  const mostrar = (k, activo) => {
    if (k < 0 || !datos[k]) { lectura.textContent = ""; return; }
    const partes = datasets.filter(ds => hayDato(ds, k))
      .map(ds => (comparar ? ds.label + " " : "") + fmt(ds.data[k], decimales) + unidad);
    lectura.textContent = (activo ? "" : "Último dato · ") + fechaLarga(datos[k].f) + "  ·  " + partes.join("  ·  ");
  };
  mostrar(ultimoDato(), false);

  grafico = new Chart(document.getElementById("grafico"), {
    type: "line",
    data: {labels: etiquetas, datasets},
    plugins: [cruz],
    options: {
      responsive: true, maintainAspectRatio: false, animation: {duration: 600, easing: "easeOutCubic"},
      interaction: {mode: "index", intersect: false},
      onHover: (ev, els) => mostrar(els.length ? els[0].index : ultimoDato(), els.length > 0),
      plugins: {
        cruz: {color: colTexto},
        legend: {display: comparar, labels: {color: colTexto, boxWidth: 12}},
        tooltip: {
          displayColors: comparar, padding: 10,
          callbacks: {
            title: it => fechaLarga(it[0].label),
            label: c => c.dataset.label + ": " + fmt(c.parsed.y, decimales) + unidad
          }
        }
      },
      scales: {
        x: {ticks: {color: colTexto, maxTicksLimit: 5, maxRotation: 0}, grid: {display: false}},
        y: {ticks: {color: colTexto}, grid: {color: colLinea}}
      }
    }
  });
}

function refrescar() { pintarTabs(); pintarMonedas(); pintarTarjetas(); pintarRangos(); pintarGrafico(); }

document.getElementById("todos").onclick = () => { comparar = !comparar; refrescar(); };
cargar();
</script>
</body>
</html>
